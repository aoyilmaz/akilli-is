# Bordro Muhasebe Hesap Eşleştirmesi
# Bordro kalemlerinin hangi muhasebe hesaplarına yazılacağını tanımlar

# Gider Hesapları (Borç)
expense_accounts:
  # Personel giderleri - İşletmelere göre değişir
  # 730: Genel Üretim Giderleri - Üretim personeli için
  # 770: Genel Yönetim Giderleri - Yönetim personeli için
  default: "770"  # Varsayılan olarak yönetim giderleri
  production: "730"  # Üretim departmanı personeli için
  
  # Alt hesap detayları (opsiyonel)
  sub_accounts:
    gross_salary: "01"  # 770.01 Brüt Ücret
    overtime: "02"      # 770.02 Fazla Mesai
    bonus: "03"         # 770.03 Prim ve İkramiye
    sgk_employer: "04"  # 770.04 İşveren SGK Payı
    unemployment_employer: "05"  # 770.05 İşveren İşsizlik Payı

# Borç Hesapları (Alacak)
liability_accounts:
  net_salary: "335"     # 335 Personele Borçlar
  income_tax: "360"     # 360 Ödenecek Vergi ve Fonlar
  stamp_tax: "360"      # 360 Ödenecek Vergi ve Fonlar
  sgk_employee: "361"   # 361 Ödenecek Sosyal Güvenlik Kesintileri
  sgk_employer: "361"
  unemployment_employee: "361"
  unemployment_employer: "361"
  
  # Alt hesap detayları (opsiyonel)
  sub_accounts:
    income_tax: "01"    # 360.01 Gelir Vergisi
    stamp_tax: "02"     # 360.02 Damga Vergisi
    sgk: "01"           # 361.01 SGK Primleri
    unemployment: "02"  # 361.02 İşsizlik Sigortası

# Departman bazlı hesap eşleştirmesi
department_mappings:
  # Departman ID -> Gider hesap kodu
  # Örnek:
  # 1: "730"  # Üretim departmanı
  # 2: "770"  # Yönetim departmanı
  default: "770"

# Yevmiye açıklama şablonu
journal_description_template: "{period} Dönemi Personel Maaş Tahakkuku"
